<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futurista | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen py-10 px-4 flex items-center justify-center">

    <div class="max-w-md w-full space-y-8">
        <div class="text-center space-y-2">
            <h1 class="text-4xl font-extrabold text-white tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-300">
                FUTURISTA
            </h1>
        </div>

        <div class="space-y-4">
            <!-- Option 1: AI Planner -->
            <a href="{% url 'finance_form' %}" class="block w-full bg-slate-900 border border-slate-700 hover:border-indigo-500 rounded-xl p-5 transition-all hover:scale-[1.02] group">
                <h3 class="text-lg font-bold text-white group-hover:text-indigo-400">1. Budget Planner</h3>
                <p class="text-xs text-slate-400 mt-1">Set savings goals and calculate their feasibility.</p>
            </a>

            <!-- Option 2: Log Transaction -->
            <a href="{% url 'log_transaction' %}" class="block w-full bg-slate-900 border border-slate-700 hover:border-emerald-500 rounded-xl p-5 transition-all hover:scale-[1.02] group">
                <h3 class="text-lg font-bold text-white group-hover:text-emerald-400">2. Log New Transaction</h3>
                <p class="text-xs text-slate-400 mt-1">Quick-add income or expenses to your database.</p>
            </a>

            <!-- Option 3: Monthly Reports -->
            <a href="{% url 'report_input' %}" class="block w-full bg-slate-900 border border-slate-700 hover:border-amber-500 rounded-xl p-5 transition-all hover:scale-[1.02] group">
                <h3 class="text-lg font-bold text-white group-hover:text-amber-400">3. Monthly Expense Reports</h3>
                <p class="text-xs text-slate-400 mt-1">Monthly spending Analysis with AI diagnosis.</p>
            </a>
        </div>
    </div>

</body>
</html>
