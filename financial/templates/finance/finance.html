<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futurista | Financial Goal Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen py-10 px-4 flex items-center justify-center">

    <div class="max-w-xl w-full space-y-6">
        
        <div class="text-center space-y-2">
            <h1 class="text-4xl font-extrabold text-white tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-300">
                FUTURISTA
            </h1>
            <p class="text-slate-400 text-sm">AI Financial Planner & Lifestyle Engine</p>
        </div>

        {% if message %}
            <div class="px-4 py-3 rounded-lg border border-emerald-500/30 bg-emerald-500/10 text-emerald-400 text-sm text-center">
                {{ message }}
            </div>
        {% endif %}

        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl shadow-2xl p-6 md:p-8 space-y-8">
            
         
            <form method="POST" action="">
                {% csrf_token %}
                <h2 class="text-base font-bold text-white mb-3">1. Set Your Savings Goal</h2>
                <div class="grid grid-cols-2 gap-4 mb-5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Target Budget ($)</label>
                        <input type="number" step="0.01" name="budget" placeholder="18000.00" required 
                            class="w-full bg-slate-950 border border-slate-700 text-white rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Timeline (Months)</label>
                        <input type="number" name="timeline_months" value="12" required 
                            class="w-full bg-slate-950 border border-slate-700 text-white rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>
                <button type="submit" name="form_action" value="generate_plan"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 rounded-lg shadow-lg shadow-indigo-600/30 transition-all hover:scale-[1.01]">
                    Generate Plan & Trade-Offs →
                </button>
            </form>

            <hr class="border-slate-800">

        
            <form method="POST" action="">
                {% csrf_token %}
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">2. Log New Transaction</h2>
                <div class="space-y-3 mb-5">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="date" name="date" required class="bg-slate-950 border border-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none">
                        <input type="text" name="month" placeholder="Month (e.g. March)" required class="bg-slate-950 border border-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none">
                    </div>
                    <input type="text" name="description" placeholder="Description (e.g. Target store)" required class="w-full bg-slate-950 border border-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" step="0.01" name="amount" placeholder="Amount ($)" required class="bg-slate-950 border border-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none">
                        <select name="category" required class="bg-slate-950 border border-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none">
                            <option value="">Category...</option>
                            
                            <optgroup label="Discretionary / Dynamic">
                                <option value="Groceries">Groceries</option>
                                <option value="Restaurants">Restaurants</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Gas & Fuel">Gas & Fuel</option>
                                <option value="Home Improvement">Home Improvement</option>
                                <option value="Coffee Shops">Coffee Shops</option>
                                <option value="Alcohol & Bars">Alcohol & Bars</option>
                                <option value="Fast Food">Fast Food</option>
                                <option value="Haircut">Haircut</option>
                                <option value="Electronics & Software">Electronics & Software</option>
                                <option value="Food & Dining">Food & Dining</option>
                                <option value="Entertainment">Entertainment</option>
                            </optgroup>
                            
                            <optgroup label="Fixed / Static">
                                <option value="Mortgage & Rent">Mortgage & Rent</option>
                                <option value="Utilities">Utilities</option>
                                <option value="Mobile Phone">Mobile Phone</option>
                                <option value="Internet">Internet</option>
                                <option value="Auto Insurance">Auto Insurance</option>
                                <option value="Music">Music</option>
                                <option value="Movies & Dvds">Movies & DVDs</option>
                                <option value="Television">Television</option>
                            </optgroup>

                            <optgroup label="Income">
                                <option value="Income">Income</option>
                            </optgroup>
                        </select>
                    </div>
                </div>
                <button type="submit" name="form_action" value="log_transaction"
                    class="w-full bg-slate-800 hover:bg-slate-700 text-white font-semibold py-3.5 rounded-lg transition-all hover:scale-[1.01]">
                    Save Transaction
                </button>
            </form>

        </div>
    </div>

</body>
</html>
