<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Dashboard</title>
  
    <script src="https://cdn.tailwindcss.com"></script>
  
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
  
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen flex items-center justify-center p-6 text-slate-200">

    <div class="w-full max-w-lg">
        
        {% if message %}
            <div class="mb-6 px-4 py-3 rounded-lg border border-emerald-500/30 bg-emerald-500/10 text-emerald-400 text-sm font-medium text-center shadow-[0_0_15px_rgba(16,185,129,0.1)]">
                {{ message }}
            </div>
        {% endif %}

     
        <div class="bg-slate-800/50 backdrop-blur-xl border border-slate-700/50 rounded-2xl shadow-2xl p-8">
            <div class="mb-8 text-center">
                <h2 class="text-3xl font-bold text-white tracking-tight">FUTURISTA</h2>
                <p class="text-slate-400 text-sm mt-2">Enter your data for processing.</p>
            </div>

            <form method="POST" action="" class="space-y-5">
                {% csrf_token %}
        
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Date</label>
                        <input type="date" name="date" required 
                            class="w-full bg-slate-900/50 border border-slate-700 text-white text-sm rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Month</label>
                        <input type="text" name="month" placeholder="January" required 
                            class="w-full bg-slate-900/50 border border-slate-700 text-white text-sm rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder-slate-600">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Description</label>
                    <input type="text" name="description" placeholder="e.g., Target groceries" required 
                        class="w-full bg-slate-900/50 border border-slate-700 text-white text-sm rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder-slate-600">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Category</label>
                    <select name="category" required 
                        class="w-full bg-slate-900/50 border border-slate-700 text-white text-sm rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all appearance-none">
                        <option value="" class="bg-slate-800 text-slate-400">Choose a category...</option>
                        <option value="Mortgage & Rent" class="bg-slate-800">Mortgage & Rent</option>
                        <option value="Utilities" class="bg-slate-800">Utilities</option>
                        <option value="Mobile Phone" class="bg-slate-800">Mobile Phone</option>
                        <option value="Internet" class="bg-slate-800">Internet</option>
                        <option value="Auto Insurance" class="bg-slate-800">Auto Insurance</option>
                        <option value="Music" class="bg-slate-800">Music</option>
                        <option value="Movies & Dvds" class="bg-slate-800">Movies & DVDs</option>
                        <option value="Television" class="bg-slate-800">Television</option>
                    </select>
                </div>

               
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Amount ($)</label>
                        <input type="number" step="0.01" name="amount" placeholder="0.00" required 
                            class="w-full bg-slate-900/50 border border-slate-700 text-white text-sm rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder-slate-600">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Target Budget ($)</label>
                        <input type="number" step="0.01" name="budget" placeholder="0.00" required 
                            class="w-full bg-slate-900/50 border border-slate-700 text-white text-sm rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder-slate-600">
                    </div>
                </div>

                <button type="submit" 
                    class="w-full mt-4 bg-indigo-500 hover:bg-indigo-600 text-white font-semibold rounded-lg px-4 py-3 shadow-[0_0_20px_rgba(99,102,241,0.3)] transition-all hover:scale-[1.02] active:scale-[0.98]">
                    Submit and Get Result
                </button>
            </form>
        </div>
    </div>

</body>
</html>
