<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futurista | Log Transaction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    {% load static %}
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Background Logo Fade Setup */
        .hero-bg {
            background-image: 
                linear-gradient(to bottom, rgba(3, 7, 18, 0.85), rgba(3, 7, 18, 0.95)),
                radial-gradient(circle at center, rgba(15, 23, 42, 0.6) 0%, rgba(3, 7, 18, 0.9) 100%),
                url("{% static 'back.jpg' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen py-10 px-4 flex items-center justify-center hero-bg">

    <div class="max-w-xl w-full space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Log Transaction</h1>
            <p class="text-slate-400 text-sm">Add manual entries to your database</p>
        </div>

        {% if message %}
            <div class="px-4 py-3 rounded-lg border border-emerald-500/30 bg-emerald-500/10 text-emerald-400 text-sm text-center">
                {{ message }}
            </div>
        {% endif %}

        <div class="bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-2xl shadow-2xl p-6 md:p-8">
            <form method="POST" action="" class="space-y-5">
                {% csrf_token %}
                <div class="grid grid-cols-2 gap-3">
                    <input type="date" name="date" required class="bg-slate-950 border border-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none focus:border-emerald-500">
                    <input type="text" name="month" placeholder="Month (e.g. March)" required class="bg-slate-950 border border-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none focus:border-emerald-500">
                </div>
                <input type="text" name="description" placeholder="Description (e.g. Target store)" required class="w-full bg-slate-950 border border-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none focus:border-emerald-500">
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" step="0.01" name="amount" placeholder="Amount ($)" required class="bg-slate-950 border border-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none focus:border-emerald-500">
                    <select name="category" required class="bg-slate-950 border border-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none focus:border-emerald-500">
                        <option value="">Category...</option>
                        <optgroup label="Discretionary / Dynamic">
                            {% for key, val in dynamic_categories %}
                                <option value="{{ key }}">{{ val }}</option>
                            {% endfor %}
                        </optgroup>
                        <optgroup label="Fixed / Static">
                            {% for key, val in static_categories %}
                                <option value="{{ key }}">{{ val }}</option>
                            {% endfor %}
                        </optgroup>
                        <optgroup label="Income">
                            {% for key, val in income_categories %}
                                <option value="{{ key }}">{{ val }}</option>
                            {% endfor %}
                        </optgroup>
                    </select>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3.5 rounded-lg transition-all mt-4 hover:scale-[1.01]">
                    Save Transaction
                </button>
            </form>
        </div>

        <div class="text-center mt-4">
            <a href="{% url 'dashboard' %}" class="text-xs text-slate-500 hover:text-white transition-colors">← Back to Dashboard</a>
        </div>
    </div>

</body>
</html>
