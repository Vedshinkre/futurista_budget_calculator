<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futurista | Select Month</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen py-10 px-4 flex items-center justify-center">

    <div class="max-w-md w-full space-y-6 bg-slate-900/80 border border-slate-800 rounded-2xl shadow-2xl p-8">
        <h2 class="text-2xl font-bold text-white mb-2">Audit History</h2>
        <p class="text-xs text-slate-400 mb-6">Select a specific month and year to generate a retrospective financial report.</p>

        {% if message %}
            <div class="px-4 py-3 rounded-lg border border-rose-500/30 bg-rose-500/10 text-rose-400 text-xs mb-4">
                {{ message }}
            </div>
        {% endif %}

        <form method="POST" action="" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Select Month</label>
                <select name="month" required class="w-full bg-slate-950 border border-slate-700 text-white rounded-lg px-4 py-3 outline-none focus:border-amber-500">
                    <option value="1">January</option>
                    <option value="2">February</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                    <option value="5">May</option>
                    <option value="6">June</option>
                    <option value="7">July</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Enter Year</label>
                <input type="number" name="year" value="2024" required class="w-full bg-slate-950 border border-slate-700 text-white rounded-lg px-4 py-3 outline-none focus:border-amber-500">
            </div>

            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-3.5 rounded-lg transition-all hover:scale-[1.02]">
                Generate Historical Report →
            </button>
        </form>
        
        <div class="text-center mt-4">
            <a href="{% url 'dashboard' %}" class="text-xs text-slate-500 hover:text-white transition-colors">← Back to Dashboard</a>
        </div>
    </div>

</body>
</html>
